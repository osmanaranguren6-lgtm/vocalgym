<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>VocalGym pitch test</title><pre id="out">Ejecutando…</pre><script type="module">
const out=document.querySelector('#out'),ctx=new AudioContext({sampleRate:48000});await ctx.resume();await ctx.audioWorklet.addModule('../js/pitch-worklet.js');const node=new AudioWorkletNode(ctx,'pitch-processor',{processorOptions:{bufferSize:2048,hop:512}}),osc=ctx.createOscillator(),gain=ctx.createGain(),silent=ctx.createGain();gain.gain.value=.3;silent.gain.value=0;const all=[];node.port.onmessage=e=>e.data.voiced&&all.push(e.data.f0);osc.connect(gain).connect(node).connect(silent).connect(ctx.destination);osc.frequency.setValueAtTime(220,ctx.currentTime);osc.start();setTimeout(()=>osc.frequency.setValueAtTime(440,ctx.currentTime),1600);setTimeout(()=>{osc.stop();node.disconnect();const lines=[`muestras: ${all.length}`];for(const expected of [220,440]){const candidates=all.filter(f=>Math.abs(1200*Math.log2(f/expected))<100),f=candidates.length?candidates.sort((a,b)=>Math.abs(a-expected)-Math.abs(b-expected))[Math.floor(candidates.length/2)]:NaN,c=Number.isFinite(f)?1200*Math.log2(f/expected):NaN;lines.push(`${expected} Hz → ${Number.isFinite(f)?f.toFixed(4):'sin muestra'} Hz (${Number.isFinite(c)?c.toFixed(3):'—'} cents) ${Number.isFinite(c)&&Math.abs(c)<=2?'PASS':'FAIL'}`)}out.textContent=lines.join('\n')+'\nFin.'},3500);
</script>
